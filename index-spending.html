<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>氪金历史</title>
    <script>
      const spendingAssetVersion = '20260820-6';
      document.write(`<link rel="stylesheet" href="./assets/css/precious.css?v=${spendingAssetVersion}" /><link rel="stylesheet" href="./assets/css/spending.css?v=${spendingAssetVersion}" />`);
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">SPENDING</div>
          <h1>氪金历史</h1>
        </div>
        <div class="topbar-actions">
          <div class="tools-actions card tools-actions-top">
            <button id="upload-trigger" class="ghost-button action-button" type="button">
              <span class="desktop-action-label">上传 JSON</span>
              <span class="mobile-action-label">上传</span>
            </button>
            <button id="mobile-download-current" class="ghost-button action-button mobile-export-proxy" type="button">导出</button>
            <div class="mobile-more-actions is-open">
              <button class="ghost-button action-button mobile-more-trigger" type="button" aria-expanded="false">更多</button>
              <div class="mobile-more-panel">
                <button id="download-template" class="ghost-button action-button" type="button">下载模板</button>
                <button id="download-current" class="ghost-button action-button" type="button">导出当前数据</button>
                <button id="load-sample" class="ghost-button action-button" type="button">加载示例</button>
                <button id="clear-local-data" class="ghost-button action-button danger-button" type="button">清空本地数据</button>
              </div>
            </div>
          </div>
          <div id="current-file-label" class="current-file-label" aria-live="polite">当前数据：未加载</div>
          <div id="dirty-indicator" class="dirty-indicator" aria-live="polite" hidden>当前数据已修改，尚未导出</div>
          <div id="sync-status" class="sync-status" aria-live="polite">准备就绪</div>
        </div>
      </header>

      <main class="main-content">
        <section class="section" id="spending-section"></section>
      </main>
    </div>

    <input id="upload-input" type="file" accept="application/json,.json" hidden />

    <dialog id="other-item-dialog" class="edit-dialog">
      <form method="dialog" id="other-item-form" class="edit-form">
        <div class="dialog-header">
          <h3 id="other-item-dialog-title">新增其他计数</h3>
        </div>
        <div class="form-grid">
          <label>
            <span>项目</span>
            <input id="other-item-name-input" name="name" maxlength="80" placeholder="如 创世结晶礼包" required />
          </label>
          <label>
            <span>氪金所得（原石）</span>
            <input id="other-item-primogems-input" name="primogems" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required />
          </label>
          <label class="form-span-2">
            <span>金额（元）</span>
            <input id="other-item-amount-input" name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" required />
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="ghost-button mobile-dialog-cancel" data-dialog-cancel="other">取消</button>
          <button type="button" class="ghost-button danger-button" id="other-item-delete">删除</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="incentive-item-dialog" class="edit-dialog">
      <form method="dialog" id="incentive-item-form" class="edit-form">
        <div class="dialog-header">
          <h3 id="incentive-item-dialog-title">新增激励计数</h3>
        </div>
        <div class="form-grid incentive-form-grid">
          <label>
            <span>项目</span>
            <input id="incentive-item-name-input" name="name" maxlength="80" placeholder="如 商城返利" required />
          </label>
          <label>
            <span>激励值（原石）</span>
            <input id="incentive-item-primogems-input" name="primogems" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required />
          </label>
          <label class="form-span-2">
            <span>成本（元）</span>
            <input id="incentive-item-cost-input" name="cost" type="number" step="0.01" inputmode="decimal" placeholder="0" required />
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="ghost-button mobile-dialog-cancel" data-dialog-cancel="incentive">取消</button>
          <button type="button" class="ghost-button danger-button" id="incentive-item-delete">删除</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <script>
      (() => {
        const mediaQuery = window.matchMedia('(max-width: 760px)');
        const menus = Array.from(document.querySelectorAll('.mobile-more-actions'));
        const mobileExportButton = document.querySelector('#mobile-download-current');
        const exportButton = document.querySelector('#download-current');

        function closeMenu(menu) {
          menu.classList.remove('is-open');
          menu.querySelector('.mobile-more-trigger')?.setAttribute('aria-expanded', 'false');
        }

        function syncMobileMoreState() {
          menus.forEach((menu) => {
            menu.classList.toggle('is-open', !mediaQuery.matches);
            menu.querySelector('.mobile-more-trigger')?.setAttribute('aria-expanded', menu.classList.contains('is-open') ? 'true' : 'false');
          });
        }

        function closeMenusOutside(event) {
          if (!mediaQuery.matches) return;
          menus.forEach((menu) => {
            if (menu.classList.contains('is-open') && !menu.contains(event.target)) closeMenu(menu);
          });
        }

        mediaQuery.addEventListener('change', syncMobileMoreState);
        menus.forEach((menu) => {
          menu.querySelector('.mobile-more-trigger')?.addEventListener('click', () => {
            if (!mediaQuery.matches) return;
            const open = !menu.classList.contains('is-open');
            menus.forEach(closeMenu);
            menu.classList.toggle('is-open', open);
            menu.querySelector('.mobile-more-trigger')?.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
          menu.querySelectorAll('.mobile-more-panel button').forEach((button) => {
            button.addEventListener('click', () => {
              if (mediaQuery.matches) closeMenu(menu);
            });
          });
        });
        document.addEventListener('pointerdown', closeMenusOutside, true);
        document.addEventListener('click', closeMenusOutside, true);
        document.addEventListener('keydown', (event) => {
          if (mediaQuery.matches && event.key === 'Escape') menus.forEach(closeMenu);
        });
        mobileExportButton?.addEventListener('click', () => exportButton?.click());
        syncMobileMoreState();
      })();
    </script>
    <script>
      (() => {
        const scripts = ['core', 'view', 'editor', 'app'];
        document.write(scripts.map((name) => `<script src="./assets/js/spending/${name}.js?v=${spendingAssetVersion}"><\/script>`).join(''));
      })();
    </script>
  </body>
</html>
